{% load static %}

<nav class="navbar navbar-expand-lg dc-navbar fixed-top"
     id="header">

    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand dc-navbar-brand"
           href="{% url 'inicio' %}">

            <img
                src="{% static 'img/logoFinal1.png' %}"
                alt="Bodega Doña Catita"
                class="dc-navbar-logo">

            <div class="dc-brand-text">
                <strong>Bodega</strong>
                <span>Doña Catita</span>
            </div>

        </a>


        <!-- BOTÓN MÓVIL -->
        <button
            class="navbar-toggler dc-navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPublico"
            aria-controls="menuPublico"
            aria-expanded="false"
            aria-label="Abrir menú">

            <span></span>
            <span></span>
            <span></span>

        </button>


        <!-- MENU -->
        <div class="collapse navbar-collapse"
             id="menuPublico">

            <ul class="navbar-nav mx-auto dc-navbar-menu">

                <!-- INICIO -->
                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'inicio' %}">

                        Inicio

                    </a>

                </li>


                <!-- CATÁLOGO -->
                <li class="nav-item">

                    <a class="nav-link"
                       href="/catalogo/">

                        Catálogo

                    </a>

                </li>


                <!-- PRODUCTOS -->
                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'inicio' %}#productos">

                        Productos

                    </a>

                </li>


                <!-- NOSOTROS -->
                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'inicio' %}#servicios">

                        Nosotros

                    </a>

                </li>


                <!-- CONTACTO -->
                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'contacto' %}">

                        Contacto

                    </a>

                </li>

            </ul>


            <!-- LOGIN -->
            <div class="dc-navbar-actions">

                {% if user.is_authenticated %}

                    <a href="{% url 'perfil' %}"
                       class="dc-user-link">

                        <i class="fa-regular fa-user"></i>

                        {{ user.username }}

                    </a>

                {% else %}

                    <a href="{% url 'login' %}"
                       class="dc-login-link">

                        Iniciar sesión

                    </a>

                    <a href="{% url 'login' %}"
                       class="dc-navbar-button">

                        <span>Ingresar</span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </a>

                {% endif %}

            </div>

        </div>

    </div>

</nav>
