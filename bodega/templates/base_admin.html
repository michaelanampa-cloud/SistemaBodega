<!DOCTYPE html>
<html>

<head>

    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'img/logo2.png' %}" type="image/png">
    <title>{% block title %}Bodega{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link href="{% static 'css/sidebar.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/catalogo.css' %}">

    <!-- Animaciones Scroll -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/6.5.0/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    {% block extra_head %}{% endblock %}

</head>

<script>

    window.addEventListener("scroll", function () {

        let header = document.getElementById("header");

        if (window.scrollY > 80) {
            header.classList.add("header-scrolled");
        } else {
            header.classList.remove("header-scrolled");
        }

    });

</script>

<body>

    {% include 'includes/sidebar_admin.html' %}

    <main class="main-content">

        {% include 'includes/sweetalert_messages.html' %}

        {% block content %}
        {% endblock %}

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

    <script>
        AOS.init({
            duration: 900,
            once: true
        });
    </script>



</body>

</html>
