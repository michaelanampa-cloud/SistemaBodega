{% extends 'base.html' %}

{% block title %}Perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
	<div class="col-md-6">
		<div class="card">
			<div class="card-body">
				<h3 class="card-title">Perfil de {{ user.username }}</h3>
				<p><strong>Email:</strong> {{ user.email }}</p>
				<p><strong>Nombre de usuario:</strong> {{ user.username }}</p>
				<a class="btn btn-secondary" href="{% url 'logout' %}">Cerrar sesión</a>
			</div>
		</div>
	</div>
</div>
{% endblock %}
