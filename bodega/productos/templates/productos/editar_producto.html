{% extends 'base_admin.html' %}

{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="container">
  <br>
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title mb-3"><i class="fas fa-edit"></i> Editar Producto</h3>
          <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
              <div class="mb-3">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
              </div>
            {% endfor %}
            <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> Actualizar</button>
            <a class="btn btn-secondary" href="{% url 'lista_productos' %}"><i class="fas fa-arrow-left"></i> Cancelar</a>
          </form>
        </div>
      </div>
      <br>
    </div>
  </div>
</div>
{% endblock %}
